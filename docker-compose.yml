version: '3.8'

services:
  whatsapp-messenger:
    build: .
    container_name: whatsapp-messenger
    ports:
      - "5556:5556"
    environment:
      - PORT=5556
      - LM_STUDIO_BASE_URL=${LM_STUDIO_BASE_URL:-https://api.groq.com/openai/v1}
      - LM_STUDIO_API_KEY=${LM_STUDIO_API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-llama-3.1-8b-instant}
      - MAX_TOKENS=${MAX_TOKENS:-8000}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5556/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
